<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGGA editor</title><style>
:root{--bg:#111;--panel:#1b1b1b;--line:#2c2c2c;--fg:#eee;--dim:#888;--on:#2a6;--acc:#58a;--warn:#c84;--sel:#fd5}
*{box-sizing:border-box}body{font:14px/1.4 system-ui,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
header{background:#222;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b{letter-spacing:.08em}a{color:#8bf}button,select,input{font:inherit}
button{background:var(--on);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}button.sec{background:#345}button.warn{background:var(--warn)}

nav{display:flex;gap:4px;flex-wrap:wrap;padding:6px 12px;background:#181818;border-bottom:1px solid var(--line)}
.tab{background:#2a2a2a;padding:5px 10px;border-radius:6px;cursor:pointer;user-select:none}.tab.on{background:var(--acc)}
main{padding:10px 12px 60px}h3{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;color:#bbb}small,.dim{color:var(--dim)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 12px}
.grid label{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--panel);padding:4px 6px;border-radius:5px}
.ov{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#0b0b0b}
.tr{display:flex;align-items:center;height:22px}.tr .lb{position:sticky;left:0;background:#0b0b0b;min-width:150px;max-width:150px;padding:0 6px;font-size:12px;white-space:nowrap;overflow:hidden;cursor:pointer;z-index:1}
.tr .lb.cur{color:var(--sel)}.c{width:15px;height:17px;margin:0 1px;border-radius:2px;background:#262626;flex:none;cursor:pointer;position:relative}
.c.bar{margin-right:4px}.c.barl{margin-right:9px}.c.out{background:#151515}.c.on{background:var(--on)}.c.on.out{background:#164}.c.on.ghost{background:#1d5f66}.c.sel{outline:2px solid var(--sel)}
.c.tie:after{content:'';position:absolute;right:-3px;top:7px;width:5px;height:3px;background:#9cf}.c.slide:after{background:#f9c}
.c.lock:before{content:'';position:absolute;left:2px;top:2px;width:4px;height:4px;border-radius:2px;background:#fd5}
.c.rat{box-shadow:inset 0 -3px 0 #f84}.tape{font-size:12px;color:var(--dim);padding-left:6px}
table{border-collapse:collapse}td,th{padding:2px 5px;border-bottom:1px solid var(--line);text-align:left;font-weight:normal;font-size:13px}th{color:#aaa}
.lane{display:flex;align-items:flex-end;height:160px;background:#0b0b0b;border:1px solid var(--line);border-radius:6px;padding:4px;touch-action:none;overflow-x:auto;user-select:none}
.lane .b{flex:none;width:13px;margin:0 1px;height:100%;position:relative;background:#181818;border-radius:2px}.lane .b.out{background:#101010}
.lane .b i{position:absolute;left:0;right:0;bottom:0;background:var(--acc);border-radius:2px}.lane .b.off i{background:transparent}.lane .b.stepon{box-shadow:inset 0 2px 0 var(--on)}

@media (max-width:600px){.tr .lb{min-width:84px;max-width:84px;font-size:11px}main{padding:8px 6px 60px}}
.chg{color:var(--sel)}.mono{font-family:ui-monospace,monospace}
.c.ph{box-shadow:inset 0 0 0 2px #fff}.pp{font-style:normal;color:var(--warn);margin-left:4px}#pos{font-size:12px;color:#9cf}
.thb{font-weight:normal;font-size:10px;color:#9cf}
label.tg{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:#ccc}

.keys{position:sticky;left:0;z-index:2;background:#151515;flex:none;width:38px}.keys div{height:10px;font-size:9px;line-height:10px;color:#888;padding-left:3px;border-bottom:1px solid #1d1d1d}
.keys div.bk{background:#101010}#roll{position:relative;flex:none;touch-action:none;user-select:none}
.rn{position:absolute;height:9px;background:var(--acc);border-radius:2px;cursor:grab;min-width:3px}.rn.sel{background:var(--sel)}.rn.out{opacity:.35}
.rn .rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:ew-resize}.rph{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.75;pointer-events:none;display:none}
.rend{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);pointer-events:none}
</style></head><body>
<header><b>SAGGA EDITOR</b> <span id="pname" class="mono"></span>
<button id="bsave" onclick="save()">Salva</button><button class="sec" onclick="undoOne()">Annulla</button><button class="sec" onclick="reload(true)">Ricarica</button>
<button class="sec" onclick="sendFm1()">Manda all'FM-1</button><button class="sec" onclick="recvFm1()">Ricevi dall'FM-1</button>
<select id="vers"><option value="">versioni</option></select><button class="sec" onclick="restore()">Ripristina</button>
<label class="tg"><input type="checkbox" id="follow" onchange="V.follow=this.checked;keepView();followSet()"> segui l'FM-1</label>
<label class="tg"><input type="checkbox" id="listen" onchange="V.listen=this.checked;keepView()"> ascolta</label><span id="pos"></span>
<a href="/">libreria</a><span id="status"></span></header>
<nav id="tabs"></nav><main id="main">caricamento...</main>
<script>
'use strict';
// ---- the lists of the FM-1's panel (firmware/src/dinghy.c, sagga_ui.c: tests/sagga_editor_tests.py checks them)
const DIV = ['1/1','1/2','1/4.','1/4','1/8.','1/4T','1/8','1/16.','1/8T','1/16','1/16T','1/32','1/32T',
  '1/4 5:4','1/8 5:4','1/16 5:4','1/4 7:4','1/8 7:4','1/16 7:4'];   // 0.25: the polyrhythms, five / seven steps in the time of four
const DIR = ['FWD','REV','PING','RND'];
const ARPM = ['BLOCK','UP','DOWN','UP-DN','DN-UP','UP&DN','CONV','DIV','RND','WALK','PLAYED','THUMB','PINKY'];
const SHAPES = ['SINE','TRI','RAMP+','RAMP-','SQUARE','S&H','SMOOTH','DECAY','ENV'];
const RATES = ['16 BAR','8 BAR','4 BAR','3 BAR','2 BAR','1.5 BAR','1 BAR','3/4 BAR','1/2 BAR','3/8 BAR','1/4 BAR','3/16','1/8 BAR','3/32','1/16','1/32','1/4T','1/8T','1/16T','1/32T'];
const DESTS = ['CC','VEL','GATE','CHANCE','TIMING','SWING','MOD ONLY'];
const QUANT = ['AUTO','NOW','BEAT','BAR','2 BARS','4 BARS','8 BARS'];
const EVERY = ['BEAT','2 BEATS','BAR','2 BARS'];
const MFX = ['OFF','HARM','OCTAVE','ECHO','VEL CURVE','CHANCE','RANDOM','NOTE FILTER','GATE','GLITCH'];
const ECHO_T = ['1/32','1/16','1/8T','1/16.','1/8','1/4T','1/8.','1/4'], OCT_W = ['ALT','RANDOM','3RD','4TH'];
const GATE_F = ['X1/4','X1/2','X3/4','X1','X3/2','X2','X4'], GATE_X = ['OFF','1/32','1/16','1/8','1/4','1/2','1 BAR','2 BARS'];
const GLITCH_K = ['MIX','STUTTER','RISE','JUMP','CUT'];
const ENV_T = ['0','1/96','1/48','1/32','1/24','1/16','1/16.','1/8','1/8.','1/4','1/4.','1/2','1/2.','1 BAR','2 BARS','4 BARS'];
const MOD_S = ['OFF','LFO','MACRO','ENERGY','RANDOM','VEL','CC IN'], MOD_D = ['OFF','DEPTH','CENTER','VEL','GATE','CHANCE','TIMING','SWING','FX'];
// 0.19: the MIDI FX chain of track t (a box: that effect plays; mfxc on, a bit per effect; 0.20: mfxd on, a bit per new
// one). 0.20: the rows in the order they play (mfxd order), the arrows move one earlier or later
function mfxRow(t, fx) {
  const o = fx < 5 ? bit('mfxc', t, 'on', '-', 1 << fx) : bit('mfxd', t, 'on', '-', 1 << (fx - 5));
  const mv = ' <button class="sec" data-mv="' + t + ',' + fx + ',-1">&uarr;</button><button class="sec" data-mv="' + t + ',' + fx + ',1">&darr;</button>';
  let p = '';
  switch (fx) {
  case 4: p = ' curva ' + num('mfxc', t, 'amt', 3, -8, 8, 'w2'); break;
  case 2: p = ' ottave ' + num('mfxc', t, 'amt', 1, -2, 2, 'w2') + ' ' + sel('mfxc', t, 'time', 1, OCT_W); break;
  case 1: p = ' intervallo ' + num('mfxc', t, 'amt', 0, -12, 12, 'w2') + ' voce % ' + num('mfxc', t, 'fb', 0, 10, 100, 'w2'); break;
  case 3: p = ' ripetizioni ' + num('mfxc', t, 'amt', 2, 0, 4, 'w2') + ' ' + sel('mfxc', t, 'time', 2, ECHO_T) + ' resta % ' + num('mfxc', t, 'fb', 2, 10, 100, 'w2'); break;
  case 5: p = ' passa % ' + num('mfxd', t, 'amt', 0, 0, 100, 'w2') + ' ' + sel('mfxd', t, 'time', 0, ['OGNI NOTA','OGNI STEP']); break;
  case 6: p = ' note &plusmn; ' + num('mfxd', t, 'amt', 1, 0, 12, 'w2') + ' velocity &plusmn; ' + num('mfxd', t, 'time', 1, 0, 64, 'w2') + ' quante % ' + num('mfxd', t, 'fb', 1, 0, 100, 'w2'); break;
  case 7: p = ' dalla ' + notesel('mfxd', t, 'amt', 2) + ' alla ' + notesel('mfxd', t, 'time', 2) + ' una ogni ' + num('mfxd', t, 'fb', 2, 1, 8, 'w2'); break;
  case 8: p = ' durata ' + sel('mfxd', t, 'amt', 3, GATE_F, -3) + ' fissa ' + sel('mfxd', t, 'time', 3, GATE_X) + ' a caso &plusmn; % ' + num('mfxd', t, 'fb', 3, 0, 50, 'w2'); break;
  case 9: p = ' quante % ' + num('mfxd', t, 'amt', 4, 0, 100, 'w2') + ' ' + sel('mfxd', t, 'time', 4, GLITCH_K) + ' pezzi ' + num('mfxd', t, 'fb', 4, 1, 8, 'w2'); break;
  default: break;
  }
  return L(MFX[fx] || '?', o + p + mv);
}
function mfxChain(t) { let s = ''; for (let k = 0; k < 9; k++) s += mfxRow(t, get('mfxd', String(t), 'order', String(k))); return s; }
document.addEventListener('click', ev => {                  // 0.20: an arrow of the chain: that effect one place earlier / later
  const b = ev.target.closest ? ev.target.closest('[data-mv]') : null;
  if (!b) return;
  const [t, fx, d] = b.dataset.mv.split(',').map(Number), o = range(0, 8, k => get('mfxd', String(t), 'order', String(k)));
  const i = o.indexOf(fx), j = i + d;
  if (i < 0 || j < 0 || j > 8) return;
  set('mfxd', String(t), 'order', String(i), o[j]); set('mfxd', String(t), 'order', String(j), o[i]);
  commit(); render();
});
const VOICE = ['CLOSE','INV 1','INV 2','DROP 2','OPEN'];
const FOLLOW = ['HOLD','RETRIG','LEGATO','MELODY','SMOOTH'];   // 0.25 MELODY: a tune - it stays where it is written, its strong notes go to the chord
const MASTERF = ['TEMPO','MORPH','FILTER'];
const REMOTE = ['OFF','CH 14','13 + 14'];
const KB = ['OFF','TRANSPOSE','TRANS <C3','CHORDS','CHORD <C3'];   // 0.26: its chords are the harmony (all the keys, or the ones below C3)
const CLOCK = ['MASTER','SLAVE'];
const ARPRATE = ['ROLL','1','2','3','4','1/2','1/4'];   // 0.18: 5 = a note every 2 steps, 6 = every 4
const MACROS = ['INTENSITY','GATE','SWING','FILTER'];
const NN = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const MODES = [['FREE',0],['IN KEY',1],['DRUM',2],['TAPE',0x20],['BREAK',0x40]];
const MODE_BITS = 0x01 | 0x02 | 0x20 | 0x40;
const ON = 1, SET = 2, LOCK = 4, XOFF = 8, TIE = 16, SLIDE = 32, F_CHAIN = 0x10, F_FOLLOW = 0x04, F_EUC = 0x08;
const GHOST = 64;                                     // 0.24: a COPY - the pattern going round again in a track longer than it (the FM-1 and the Pi's converter keep them)
const NONE = 255;
const TABS = [['tracce','Tracce'],['traccia','Traccia'],['lane','Lane'],['tape','Tape'],['scene','Scene'],['song','Song'],['catene','Catene'],['lfo','LFO'],['progetto','Progetto']];
const NAME_OK = /[A-Z0-9 \-_.+#&!'()\/:]/;
const TICKS16 = 96;                                   // tape ticks a 16th (384 a beat)

let NAME = decodeURIComponent(location.pathname.replace(/^\/edit\/?/, ''));
let P = null, O = null, N = {};                       // the project, as read (O: untouched), the core's names
let steps = new Map(), osteps = new Map();            // 't,p,s' -> step (only those not as a new project's)
let changes = new Map(), undo = [];
let V = {tab: 'tracce', pat: 0, t: 0, s: 0, toggle: true, scene: 0, lane: 0, erase: false, follow: false, listen: true, tt: 0, zoom: 14, snap: true, tsel: -1};
let TP = {}, OTP = {};                                // 0.15: the TAPE events, track -> [[on, dur, note, vel], ...] (OTP: as read)
try { const v = JSON.parse(localStorage.getItem('sagga-ed-view') || '{}'); Object.assign(V, v); } catch (e) {}
const HASH_TAPE = location.hash === '#tape';          // 0.23.2: /edit/NAME#tape (where the old piano roll's links land) opens the Tape tab

const $ = id => document.getElementById(id);
const h = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const note = n => n === NONE ? '—' : NN[n % 12] + (Math.floor(n / 12) - 1);
const clone = o => JSON.parse(JSON.stringify(o));
function status(t, err) { const s = $('status'); s.textContent = t; s.className = err ? 'err' : ''; }
function keepView() { try { localStorage.setItem('sagga-ed-view', JSON.stringify(V)); } catch (e) {} }

// ---- the data: read, change, remember
function stepOf(map, def, t, p, s) {
  const k = t + ',' + p + ',' + s;
  let st = map.get(k);
  if (!st && map === steps) { st = clone(def); map.set(k, st); }
  return st || def;
}
const getStep = (t, p, s) => stepOf(steps, P.step_default, t, p, s);
const origStep = (t, p, s) => stepOf(osteps, O.step_default, t, p, s);
function objOf(D, g, idx, orig) {
  if (g === 'step') { const [t, p, s] = String(idx).split(',').map(Number); return orig ? origStep(t, p, s) : getStep(t, p, s); }
  return idx === '-' ? D[g] : D[g][idx];
}
function get(g, idx, f, el) { if (g === 'tape') return TP[idx] || []; const o = objOf(P, g, idx); return el === '-' ? o[f] : o[f][el]; }
function getOrig(g, idx, f, el) { if (g === 'tape') return OTP[idx] || []; const o = objOf(O, g, idx, true); return el === '-' ? o[f] : o[f][el]; }
function setRaw(g, idx, f, el, v) {
  if (g === 'tape') {                                 // 0.15: a TAPE track's events, the whole list a change
    TP[idx] = v; const k = ['tape', idx, 'ev', '-'].join('|');
    if (JSON.stringify(v) === JSON.stringify(OTP[idx] || [])) changes.delete(k); else changes.set(k, v);
    return;
  }
  const o = objOf(P, g, idx);
  if (el === '-') o[f] = v; else o[f][el] = v;
  const k = [g, idx, f, el].join('|');
  if (v === getOrig(g, idx, f, el)) changes.delete(k); else changes.set(k, v);
}
let batch = null;
function set(g, idx, f, el, v) {
  idx = String(idx); el = el === undefined || el === null ? '-' : String(el);
  const old = get(g, idx, f, el);
  if (old === v) return;
  (batch || (batch = [])).push([g, idx, f, el, old]);
  setRaw(g, idx, f, el, v);
}
function commit() { if (batch && batch.length) undo.push(batch); batch = null; if (undo.length > 300) undo.shift(); dirty(); }
function undoOne() {
  const b = undo.pop(); if (!b) return status('niente da annullare');
  for (let i = b.length - 1; i >= 0; i--) setRaw(b[i][0], b[i][1], b[i][2], b[i][3], b[i][4]);
  dirty(); render();
}
function dirty() { $('bsave').textContent = changes.size ? 'Salva (' + changes.size + ')' : 'Salva'; $('bsave').disabled = !changes.size; }

function load(d) {
  P = d; O = clone(d); N = d.names || {};
  steps = new Map(); osteps = new Map();
  for (const [t, p, s, st] of d.steps) { steps.set(t + ',' + p + ',' + s, clone(st)); osteps.set(t + ',' + p + ',' + s, clone(st)); }
  changes = new Map(); undo = []; batch = null; NAME = d.name;
  TP = {}; for (let t = 0; t < 16; t++) TP[t] = [];
  for (const [t, on, dur, n, v] of d.tape || []) TP[t].push([on, dur, n, v]);
  OTP = clone(TP); V.tsel = -1;
  $('pname').textContent = d.name + (projName() ? ' · ' + projName() : ''); document.title = 'SAGGA editor - ' + d.name;
  history.replaceState(null, '', '/edit/' + encodeURIComponent(d.name));
  dirty(); versions();
}
async function api(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(await r.text() || r.statusText);
  return r.json();
}
async function reload(ask) {
  if (ask && changes.size && !confirm('Le modifiche non salvate si perdono. Ricarico?')) return;
  try { load(await api('/api/project?file=' + encodeURIComponent(NAME))); status('aperto: ' + NAME); render(); }
  catch (e) { status(e.message, 1); $('main').textContent = e.message; }
}
async function save() {
  if (!changes.size) return status('niente da salvare');
  const list = [];
  for (const [k, v] of changes) {
    const [g, i, f, e] = k.split('|');
    if (g === 'tape') { list.push(['tape', i, 'clear', '-', 0]); for (const [on, dur, n, vel] of v) list.push(['tape', i + ',' + on + ',' + dur + ',' + n, 'add', '-', vel]); }
    else list.push([g, i, f, e, v]);
  }
  const tt = [...changes].filter(([k]) => k.startsWith('tape|')).map(([k, v]) => [k.split('|')[1], v.length]);
  const sent = tt.reduce((a, x) => a + x[1], 0);
  status('salvo...');
  try {
    const d = await api('/api/project?file=' + encodeURIComponent(NAME), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({changes: list, rev: P.rev})});
    load(d);
    const fixed = list.filter(([g, i, f, e, v]) => g !== 'tape' && get(g, i, f, e) !== v).length;
    const kept = tt.reduce((a, x) => a + TP[x[0]].length, 0), dropped = sent > kept ? sent - kept : 0;
    status('salvato: ' + NAME + ' (' + list.length + ' modifiche' + (fixed ? ', ' + fixed + ' corrette dal firmware' : '') + (dropped ? ', ' + dropped + ' note TAPE fuori dal loop tolte' : '') + ')');
    render();
  } catch (e) { status(e.message, 1); }
}
async function versions() {
  try { const d = await api('/api/project/versions?file=' + encodeURIComponent(NAME));
    $('vers').innerHTML = '<option value="">versioni (' + d.versions.length + ')</option>' + d.versions.map(v => '<option>' + h(v) + '</option>').join(''); } catch (e) {}
}
async function restore() {
  const v = $('vers').value; if (!v) return status('scegli una versione');
  if (!confirm('Torno alla versione ' + v + '? Quella di adesso va nelle versioni.')) return;
  try { load(await api('/api/project/restore?file=' + encodeURIComponent(NAME) + '&v=' + encodeURIComponent(v), {method: 'POST'})); status('ripristinata ' + v); render(); }
  catch (e) { status(e.message, 1); }
}
async function sendFm1() {
  if (changes.size) { if (!confirm('Salvo le modifiche e mando il progetto all\'FM-1?')) return; await save(); if (changes.size) return; }
  if (!confirm('Il progetto sostituisce quello che c\'è adesso sull\'FM-1 (fermo). SAVE sull\'FM-1 lo tiene. Mando?')) return;
  status('mando all\'FM-1...');
  try { const d = await api('/api/fm1/send?file=' + encodeURIComponent(NAME), {method: 'POST'}); status('FM-1: ' + d.msg); }
  catch (e) { status(e.message, 1); }
}
async function recvFm1() {
  if (!confirm('Il progetto che l\'FM-1 ha adesso (fermo) prende il posto di ' + NAME + ' (questo va nelle versioni). Ricevo?')) return;
  status('chiedo all\'FM-1...');
  try { load(await api('/api/fm1/receive?file=' + encodeURIComponent(NAME), {method: 'POST'})); status('ricevuto dall\'FM-1'); render(); }
  catch (e) { status(e.message, 1); }
}

// ---- the form fields: data-* say what they change; one listener for all
function opts(names, v, base) { return names.map((n, i) => '<option value="' + (i + (base || 0)) + '"' + (i + (base || 0) === v ? ' selected' : '') + '>' + h(n) + '</option>').join(''); }
function at(g, i, f, e) { return 'data-g="' + g + '" data-i="' + i + '" data-f="' + f + '" data-e="' + (e === undefined ? '-' : e) + '"'; }
function changed(g, i, f, e) { return changes.has([g, String(i), f, e === undefined ? '-' : String(e)].join('|')) ? ' chg' : ''; }
function num(g, i, f, e, lo, hi, cls) { const v = get(g, String(i), f, e === undefined ? '-' : String(e));
  return '<input type="number" class="' + (cls || '') + changed(g, i, f, e) + '" min="' + lo + '" max="' + hi + '" value="' + v + '" ' + at(g, i, f, e) + ' data-k="num" data-lo="' + lo + '" data-hi="' + hi + '">'; }

// 0.23: what the THEORY engines know of a pattern they made (null: not theirs, or a project of before 0.23). A pattern
// emptied or moved here is no longer what they made: they forget it (else the FM-1's ENERGY would write into it again);
// a copy onto another pattern of the same track takes what they know with it.
const TH_F = ['seed', 'style', 'func', 'var', 'vary', 'energy', 'metre'];   // (0.26: the metre too - a pattern made in its bar says which)
function thOf(t, p) { const m = P.thp && P.thp[t * 8 + p]; return m && (m.style & 31) ? m : null; }
function thForget(t, p) { if (P.thp && P.thp[t * 8 + p]) for (const f of TH_F) set('thp', t * 8 + p, f, '-', 0); }
function copyPat() {
  const t2 = +$('cpt').value, p2 = +$('cpp').value;
  if (t2 === V.t && p2 === V.pat) return status('stesso pattern');
  if (!confirm('Copio T' + (V.t + 1) + ' P' + (V.pat + 1) + ' sopra T' + (t2 + 1) + ' P' + (p2 + 1) + '?')) return;
  for (let s = 0; s < 64; s++) copyInto(t2 + ',' + p2 + ',' + s, clone(getStep(V.t, V.pat, s)));
  if (t2 === V.t && thOf(V.t, V.pat)) { for (const f of TH_F) set('thp', t2 * 8 + p2, f, '-', P.thp[V.t * 8 + V.pat][f]); } else thForget(t2, p2);
  commit(); status('copiato in T' + (t2 + 1) + ' P' + (p2 + 1) + ' (Annulla lo toglie)'); render();
}
function clearPat() { if (!confirm('Svuoto T' + (V.t + 1) + ' P' + (V.pat + 1) + '?')) return; for (let s = 0; s < 64; s++) copyInto(V.t + ',' + V.pat + ',' + s, P.step_default); thForget(V.t, V.pat); commit(); render(); }
function shiftPat(d) {
  const c = P.track[V.t], a = c.start, n = c.length - a; if (n < 2) return;
  const src = range(a, c.length - 1).map(s => clone(getStep(V.t, V.pat, +s)));
  for (let k = 0; k < n; k++) copyInto(V.t + ',' + V.pat + ',' + (a + ((k + d + n) % n)), src[k]);
  thForget(V.t, V.pat);
  commit(); render();
}

function cleanName(x) {

  return [...t].map(c => NAME_OK.test(c) ? c : '_').join('').trim().slice(0, 16).trim();
}

let hearErr = 0;
async function hear(t, notes, vel, tape) {
  if (!notes.length) return;
  try { await api('/api/fm1/preview', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({t, notes, vel, gate: 250, tape: tape ? 1 : 0})}); hearErr = 0; }
  catch (e) { if (!hearErr++) status(e.message, 1); }
}
function hearStep(t, p, s) {
  const st = getStep(t, p, s);
  const notes = st.flags & SET ? st.note.filter(n => n !== NONE) : [P.track[t].pen];
  hear(t, notes, st.velocity, false);
}

// ---- 0.15: where the FM-1 is (the bridge's positions, a 16th each while it plays)
let POS = null, posTimer = null, marked = [];
function followSet() {
  if (posTimer) { clearInterval(posTimer); posTimer = null; }
  if (V.follow) posTimer = setInterval(pollPos, 150); else { POS = null; paintPos(); $('pos').textContent = ''; }
}
let polling = false;
async function pollPos() {
  if (polling || document.hidden) return;
  polling = true;
  try {
    const d = await api('/api/pos');
    POS = d.fresh && d.steps ? d : null;
    $('pos').textContent = !d.bridge ? 'bridge spento' : !d.steps ? 'l\'FM-1 non risponde' : (d.playing && d.fresh ? '▶ ' : '■ ') + d.bpm + ' BPM · scena ' + (d.scene + 1) + (d.song >= 0 ? ' · song ' + (d.song + 1) : '');
  } catch (e) { POS = null; $('pos').textContent = ''; }
  polling = false;
  paintPos();
}
function paintPos() {
  for (const el of marked) el.classList.remove('ph');
  marked = [];

  for (let t = 0; t < 16; t++) {
    const b = $('pp' + t);
    if (b) b.textContent = live && POS.pats[t] !== V.pat && !(P.track[t].flags & 0x20) ? '▶P' + (POS.pats[t] + 1) : '';
    if (!live || POS.pats[t] !== V.pat) continue;
    const c = document.querySelector('.c[data-ts="' + t + ',' + POS.steps[t] + '"]');
    if (c) { c.classList.add('ph'); marked.push(c); }
  }
  const ph = $('rph');
  if (ph) {
    const t = V.tt, len = tapeLen(t);
    if (live) { ph.style.display = 'block'; ph.style.left = ((POS.clock * 16) % len) / TICKS16 * (V.rz || V.zoom) + 'px'; } else ph.style.display = 'none';
  }
}

// ---- 0.15: the TAPE tracks (the events as the FM-1 keeps them: 384 ticks a beat, the loop TAPE battute)
const tapeLen = t => (get('track', t, 'tape_bars', '-') || 4) * barSteps() * TICKS16;   // (0.25: bars of the metre)
function evs(t) { return get('tape', String(t)); }
function setEvs(t, list) { list.sort((a, b) => a[0] - b[0] || a[2] - b[2]); set('tape', String(t), 'ev', '-', list); }
function posText(on) {                                // bar.beat.16th (+ ticks): the metre's bar and beats
  const bl = barSteps() * TICKS16, b = Math.floor(on / bl), st = Math.floor(on % bl / TICKS16), r = on % TICKS16;
  let be = 0, from = 0;
  for (let s = 1; s <= st; s++) if (beatAt(s)) { be++; from = s; }
  return (b + 1) + '.' + (be + 1) + '.' + (st - from + 1) + (r ? '+' + r : ''); }
function rTape() {
  const t = V.tt, c = P.track[t], list = evs(t), len = tapeLen(t), RH = 10;
  const room = Math.max(300, (($('main') && $('main').clientWidth) || 900) - 70);
  const Z = V.rz = Math.min(60, Math.max(V.zoom, Math.floor(room / (len / TICKS16))));   // (a short loop fills the width)
  let lo = 127, hi = 0;
  for (const e of list) { lo = Math.min(lo, e[2]); hi = Math.max(hi, e[2]); }
  if (lo > hi) { lo = 48; hi = 72; }
  lo = Math.max(0, lo - 6); hi = Math.min(127, hi + 6); if (hi - lo < 24) hi = Math.min(127, lo + 24);
  V.rlo = lo; V.rhi = hi;
  const W = Math.max(len, ...list.map(e => e[0] + e[1])) / TICKS16 * Z, H = (hi - lo + 1) * RH;
  let o = '<div class="row"><select onchange="V.tt=+this.value;V.tsel=-1;keepView();render()">' + range(0, 15).map(i => '<option value="' + i + '"' + (+i === t ? ' selected' : '') + '>' + h(trackLabel(+i)) + (P.track[+i].flags & 0x20 ? ' · TAPE ' + evs(+i).length : '') + '</option>').join('') + '</select>' +
    L('battute', sel('track', t, 'tape_bars', '-', range(1, 16), 1)) + L('quantize %', num('track', t, 'tape_quant', '-', 0, 100)) +
    '<label class="tg"><input type="checkbox"' + (V.snap ? ' checked' : '') + ' onchange="V.snap=this.checked;keepView()"> griglia 1/16</label>' +
    '<button class="sec" onclick="V.zoom=Math.max(4,V.zoom-3);keepView();render()">−</button><button class="sec" onclick="V.zoom=Math.min(40,V.zoom+3);keepView();render()">+</button>' +
    '<button class="warn" onclick="tapeClear()">Svuota la traccia</button></div>';
  if (!(c.flags & 0x20)) o += '<p class="dim">T' + (t + 1) + ' non è una traccia TAPE: le note si scrivono, ma suonano solo con il modo TAPE (scheda Traccia, o HOME 4 K1 sull\'FM-1).</p>';
  const bg = 'background-image:linear-gradient(90deg,#333 1px,transparent 1px),linear-gradient(90deg,#1e1e1e 1px,transparent 1px),repeating-linear-gradient(180deg,#141414 0 ' + RH + 'px,#101010 ' + RH + 'px ' + 2 * RH + 'px);' +
    'background-size:' + barSteps() * Z + 'px 100%,' + (barBeats() === 0x1111 || barSteps() % 4 === 0 && barWayNow() === 0 ? 4 : 2) * Z + 'px 100%,100% ' + 2 * RH + 'px';   // (0.25: the metre's bar; quarters, or eighths)
  o += '<div class="rollw"><div class="keys">';
  for (let n = hi; n >= lo; n--) o += '<div class="' + (NN[n % 12].length > 1 ? 'bk' : '') + '">' + (n % 12 === 0 ? note(n) : '') + '</div>';
  o += '</div><div id="roll" style="width:' + W + 'px;height:' + H + 'px;' + bg + '">';
  list.forEach((e, i) => {
    o += '<div class="rn' + (i === V.tsel ? ' sel' : '') + (e[0] >= len ? ' out' : '') + '" data-i="' + i + '" style="left:' + e[0] / TICKS16 * Z + 'px;top:' + (hi - e[2]) * RH + 'px;width:' + Math.max(3, e[1] / TICKS16 * Z - 1) + 'px;opacity:' + (0.45 + e[3] / 254) + '" title="' + note(e[2]) + ' · ' + posText(e[0]) + ' · vel ' + e[3] + '"><span class="rz"></span></div>';
  });
  o += '<div class="rend" style="left:' + len / TICKS16 * Z + 'px"></div><div class="rph" id="rph"></div></div></div>';
  o += '<small>' + list.length + ' note · ' + (len / (barSteps() * TICKS16)) + ' battute · tocca il vuoto: una nota (1/16); trascina una nota: la sposti, dal bordo destro: la allunghi · Canc: toglie la nota scelta · la linea arancio: la fine del loop (le note oltre vanno via al salvataggio)</small>';
  const e = list[V.tsel];
  if (e) {
    o += '<h3>NOTA ' + (V.tsel + 1) + ' · ' + posText(e[0]) + '</h3><div class="grid">' +
      L('inizio (tick)', '<input type="number" min="0" max="' + (len - 1) + '" value="' + e[0] + '" onchange="tapeEdit(0,this.value)">') +
      L('durata (tick)', '<input type="number" min="1" max="' + len + '" value="' + e[1] + '" onchange="tapeEdit(1,this.value)">') +
      L('nota', '<select onchange="tapeEdit(2,this.value)">' + range(0, 127).map(n => '<option value="' + n + '"' + (+n === e[2] ? ' selected' : '') + '>' + note(+n) + ' (' + n + ')</option>').join('') + '</select>') +
      L('velocity', '<input type="number" min="1" max="127" value="' + e[3] + '" onchange="tapeEdit(3,this.value)">') +
      '</div><div class="row"><button class="sec" onclick="hear(V.tt,[evs(V.tt)[V.tsel][2]],evs(V.tt)[V.tsel][3],true)">♪ ascolta</button><button class="warn" onclick="tapeDel()">Togli la nota</button><small>384 tick = un quarto, 96 = un sedicesimo</small></div>';
  }
  return o;
}
function tapeEdit(k, v) {
  const t = V.tt, list = clone(evs(t)), e = list[V.tsel]; if (!e) return;
  const lim = [[0, tapeLen(t) - 1], [1, tapeLen(t)], [0, 127], [1, 127]][k];
  v = Math.round(Number(v)); if (!isFinite(v)) return render();
  e[k] = Math.max(lim[0], Math.min(lim[1], v));
  setEvs(t, list); V.tsel = list.indexOf(e); commit(); render();
}
function tapeDel() { const t = V.tt, list = clone(evs(t)); if (!list[V.tsel]) return; list.splice(V.tsel, 1); V.tsel = -1; setEvs(t, list); commit(); render(); }
function tapeClear() { if (!evs(V.tt).length || !confirm('Tolgo tutte le note TAPE di T' + (V.tt + 1) + '?')) return; V.tsel = -1; setEvs(V.tt, []); commit(); render(); }
function rollEvents() {
  const el = $('roll'); if (!el) return;
  const Z = V.rz || V.zoom, RH = 10, t = V.tt;
  let drag = null;
  const snapT = x => V.snap ? Math.round(x / TICKS16) * TICKS16 : Math.round(x / 12) * 12;
  el.addEventListener('pointerdown', ev => {
    const r = el.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    const nEl = ev.target.closest('.rn');
    el.setPointerCapture(ev.pointerId);
    if (nEl) {
      const i = +nEl.dataset.i, e = evs(t)[i];
      V.tsel = i;
      drag = {i, el: nEl, x0: ev.clientX, y0: ev.clientY, on: e[0], note: e[2], dur: e[1], resize: ev.target.classList.contains('rz'), moved: false};
      document.querySelectorAll('.rn.sel').forEach(x => x.classList.remove('sel')); nEl.classList.add('sel');
      if (V.listen) hear(t, [e[2]], e[3], true);
      return;
    }
    const on = Math.max(0, Math.min(tapeLen(t) - 1, V.snap ? Math.floor(x / Z) * TICKS16 : snapT(x / Z * TICKS16)));
    const n = Math.max(0, Math.min(127, V.rhi - Math.floor(y / RH)));
    const list = clone(evs(t)), e = [on, TICKS16, n, 100];
    list.push(e); setEvs(t, list); V.tsel = list.indexOf(e); commit();
    if (V.listen) hear(t, [n], 100, true);
    render();
  });
  el.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dx = (ev.clientX - drag.x0) / Z * TICKS16, dy = Math.round((ev.clientY - drag.y0) / RH);
    if (Math.abs(ev.clientX - drag.x0) < 3 && !dy && !drag.moved) return;
    drag.moved = true;
    if (drag.resize) { drag.nd = Math.max(12, snapT(drag.dur + dx)); drag.el.style.width = Math.max(3, drag.nd / TICKS16 * Z - 1) + 'px'; }
    else {
      drag.non = Math.max(0, Math.min(tapeLen(t) - 1, drag.on + snapT(dx))); drag.nn = Math.max(0, Math.min(127, drag.note - dy));
      drag.el.style.left = drag.non / TICKS16 * Z + 'px'; drag.el.style.top = (V.rhi - drag.nn) * RH + 'px';
    }
  });
  const up = () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) {
      const list = clone(evs(t)), e = list[d.i];
      if (d.resize && d.nd !== undefined) e[1] = d.nd;
      if (!d.resize && d.non !== undefined) { e[0] = d.non; e[2] = d.nn; }
      setEvs(t, list); V.tsel = list.indexOf(e); commit();
      if (V.listen && !d.resize && d.nn !== d.note) hear(t, [e[2]], e[3], true);
    }
    render();
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
// the key slot that plays: its select carries data-g="key" data-f="cur" (SPECIAL key.cur); a slot changed is copied to the project's key
const _set = set;
set = function (g, idx, f, el, v) { _set(g, idx, f, el, v); if (g === 'key' && f !== 'cur' && Number(idx) === P.project.key_cur) syncKey(); };

window.addEventListener('keydown', ev => {
  if (V.tab === 'tape' && (ev.key === 'Delete' || ev.key === 'Backspace') && !/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName) && V.tsel >= 0) { ev.preventDefault(); tapeDel(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 'z') { ev.preventDefault(); undoOne(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 's') { ev.preventDefault(); save(); }
});
window.addEventListener('beforeunload', ev => { if (changes.size) { ev.preventDefault(); ev.returnValue = ''; } });
$('follow').checked = !!V.follow; $('listen').checked = !!V.listen;
render();
function openTape() {                                 // the Tape tab, on a TAPE track if the one shown is not (and there is one)
  if (!HASH_TAPE || !P) return;
  V.tab = 'tape'; V.tsel = -1;
  if (!(P.track[V.tt].flags & 0x20)) { const k = P.track.findIndex(c => c.flags & 0x20); if (k >= 0) V.tt = k; }
  keepView(); render();
}
if (NAME) reload(false).then(openTape).then(followSet); else $('main').innerHTML = 'Apri un progetto dalla <a href="/">libreria</a>.';
</script></body></html>
