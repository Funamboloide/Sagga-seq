<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGGA piano roll</title><style>
body{font:14px/1.4 system-ui,sans-serif;margin:0;background:#111;color:#eee;overflow:hidden}
header{background:#222;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{letter-spacing:.08em}button,select{background:#2a6;color:#fff;border:0;border-radius:6px;padding:6px 10px;font-size:14px}
button.sec{background:#345}button[disabled]{background:#444}.tab{background:#333;padding:5px 9px;border-radius:6px;cursor:pointer}
.tab.on{background:#58a}#wrap{position:relative;width:100vw;height:calc(100vh - 92px);overflow:auto;background:#000}
canvas{display:block;touch-action:none}#status{color:#9f9;font-family:ui-monospace,monospace;font-size:12px}
small{color:#999}#help{padding:4px 12px;background:#1a1a1a}</style></head><body>
<header><b>SAGGA PIANO ROLL</b> <span id="fname" class="mono"></span>
<span id="tabs"></span>
<label><small>griglia</small> <select id="snap"><option value="96">1/16</option><option value="48">1/32</option><option value="192">1/8</option><option value="384">1/4</option><option value="0">libera</option></select></label>
<label><small>zoom</small> <select id="zoom"><option value="0.12">x1</option><option value="0.25" selected>x2</option><option value="0.5">x4</option><option value="1">x8</option></select></label>
<button class="sec" id="undo">Annulla</button><button id="save">Salva nella libreria</button><span id="status"></span></header>
<div id="help"><small>clic: una nota (trascina per allungarla) · trascina una nota: la sposti · bordo destro: la durata · Canc: via · rotella + Maiusc: velocity · Ctrl+Z: annulla · le tracce STEP si vedono ma si modificano dal grid</small></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
'use strict';
const NAME = decodeURIComponent(location.pathname.replace(/^\/roll\//, ''));
document.getElementById('fname').textContent = NAME;
const PPQ = 384, BAR = 4 * PPQ, ROW = 12, LO = 24, HI = 108, LEFT = 40, TOP = 18;
let tracks = [], cur = 0, bars = 4, bpm = 120, sel = null, undoStack = [];
let zoom = 0.25, snap = 96;

// ---- SMF in / out (format 1, what sagga_sgqmid writes: PPQ 384, a tempo track, a track per SAGGA track)
function parseSMF(buf) {
  const d = new Uint8Array(buf), dv = new DataView(buf);
  if (String.fromCharCode(...d.slice(0, 4)) !== 'MThd') throw new Error('non è un file MIDI');
  const ntrk = dv.getUint16(10), div = dv.getUint16(12);
  let p = 14, out = [], tempo = 500000;
  const rdvar = () => { let v = 0, b; do { b = d[p++]; v = (v << 7) | (b & 0x7f); } while (b & 0x80); return v; };
  for (let k = 0; k < ntrk; k++) {
    const len = dv.getUint32(p + 4); let q = p + 8; const end = q + len; p = end;
    let t = 0, run = 0, name = '', ch = -1; const on = {}, notes = [];
    const save = p; p = q;
    while (p < end) {
      t += rdvar(); let st = d[p];
      if (st === 0xff) { const ty = d[p + 1]; p += 2; const ml = rdvar();
        if (ty === 3) name = new TextDecoder().decode(d.slice(p, p + ml));
        if (ty === 0x51) tempo = (d[p] << 16) | (d[p + 1] << 8) | d[p + 2];
        p += ml; continue; }
      if (st === 0xf0 || st === 0xf7) { p++; const sl = rdvar(); p += sl; continue; }
      if (st & 0x80) { run = st; p++; } else st = run;
      const d1 = d[p++]; let d2 = 0; if ((st & 0xf0) !== 0xc0 && (st & 0xf0) !== 0xd0) d2 = d[p++];
      const kind = st & 0xf0, c = st & 15;
      if (kind === 0x90 && d2) { on[c * 128 + d1] = { t, v: d2 }; ch = c; }
      else if (kind === 0x80 || kind === 0x90) { const o = on[c * 128 + d1]; if (o) { notes.push({ on: Math.round(o.t * PPQ / div), dur: Math.max(1, Math.round((t - o.t) * PPQ / div)), note: d1, vel: o.v }); delete on[c * 128 + d1]; } }
    }
    p = save;
    if (notes.length || /TAPE/.test(name)) out.push({ name, ch: ch < 0 ? out.length : ch, tape: /TAPE/.test(name), notes });
  }
  return { tracks: out, tempo };
}
function varlen(v) { const b = [v & 0x7f]; v >>= 7; while (v) { b.push((v & 0x7f) | 0x80); v >>= 7; } return b.reverse(); }
function writeSMF(trs, tempo) {
  const chunks = [];
  const tt = [0, 0xff, 0x51, 3, (tempo >> 16) & 255, (tempo >> 8) & 255, tempo & 255, 0, 0xff, 0x2f, 0];
  chunks.push(['MTrk', tt]);
  for (const tr of trs) {
    const ev = [];
    for (const n of tr.notes) { ev.push([n.on, 0x90 | tr.ch, n.note, n.vel]); ev.push([n.on + n.dur, 0x80 | tr.ch, n.note, 0]); }
    ev.sort((a, b) => a[0] - b[0] || ((a[1] & 0xf0) === 0x80 ? -1 : 1));
    let last = 0; const body = [];
    const nm = new TextEncoder().encode(tr.name || ('T' + (tr.ch + 1) + ' TAPE'));
    body.push(0, 0xff, 3, ...varlen(nm.length), ...nm);
    for (const e of ev) { body.push(...varlen(e[0] - last), e[1], e[2], e[3]); last = e[0]; }
    body.push(0, 0xff, 0x2f, 0);
    chunks.push(['MTrk', body]);
  }
  let size = 14; for (const c of chunks) size += 8 + c[1].length;
  const out = new Uint8Array(size), dv = new DataView(out.buffer);
  out.set([77, 84, 104, 100], 0); dv.setUint32(4, 6); dv.setUint16(8, 1); dv.setUint16(10, chunks.length); dv.setUint16(12, PPQ);
  let p = 14;
  for (const c of chunks) { out.set([77, 84, 114, 107], p); dv.setUint32(p + 4, c[1].length); out.set(c[1], p + 8); p += 8 + c[1].length; }
  return out;
}

// ---- the editor
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap');
const X = t => LEFT + t * zoom, T = x => (x - LEFT) / zoom, Y = n => TOP + (HI - n) * ROW, N = y => HI - Math.floor((y - TOP) / ROW);
const colors = ['#5be', '#fb5', '#9d6', '#e7a', '#ad8', '#8cf', '#fc8', '#c9f', '#7dc', '#f99', '#9cf', '#dd7', '#ea9', '#9ea', '#bbf', '#fd9'];
function layout() { cv.width = Math.max(wrap.clientWidth, X(bars * BAR) + 20); cv.height = TOP + (HI - LO + 1) * ROW + 10; draw(); }
function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let n = LO; n <= HI; n++) { const black = [1, 3, 6, 8, 10].includes(n % 12); ctx.fillStyle = black ? '#161616' : '#1e1e1e'; ctx.fillRect(LEFT, Y(n), cv.width - LEFT, ROW - 1);
    if (n % 12 === 0) { ctx.fillStyle = '#888'; ctx.font = '10px sans-serif'; ctx.fillText('C' + (n / 12 - 1), 4, Y(n) + 10); } }
  for (let t = 0; t <= bars * BAR; t += PPQ / 4) { const bar = t % BAR === 0, beat = t % PPQ === 0; ctx.strokeStyle = bar ? '#666' : beat ? '#3a3a3a' : '#262626'; ctx.beginPath(); ctx.moveTo(X(t) + .5, TOP); ctx.lineTo(X(t) + .5, cv.height); ctx.stroke();
    if (bar) { ctx.fillStyle = '#aaa'; ctx.fillText(String(t / BAR + 1), X(t) + 3, 12); } }
  tracks.forEach((tr, i) => { if (i === cur) return; ctx.globalAlpha = 0.28; ctx.fillStyle = colors[tr.ch % 16];
    for (const n of tr.notes) ctx.fillRect(X(n.on), Y(n.note) + 2, Math.max(2, n.dur * zoom), ROW - 5); });
  ctx.globalAlpha = 1;
  const tr = tracks[cur]; if (!tr) return;
  for (const n of tr.notes) { ctx.fillStyle = colors[tr.ch % 16]; ctx.globalAlpha = 0.45 + 0.55 * n.vel / 127; ctx.fillRect(X(n.on), Y(n.note) + 1, Math.max(2, n.dur * zoom), ROW - 3);
    ctx.globalAlpha = 1; if (n === sel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(X(n.on) - 1, Y(n.note), Math.max(2, n.dur * zoom) + 2, ROW - 1); ctx.lineWidth = 1; } }
  if (!tr.tape) { ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(LEFT, TOP, cv.width, cv.height); }
}
function tabs() { document.getElementById('tabs').innerHTML = tracks.map((t, i) => `<span class="tab ${i === cur ? 'on' : ''}" data-i="${i}">${t.name || 'T' + (t.ch + 1)}${t.tape ? '' : ' <small>(step)</small>'}</span>`).join(' ');
  document.querySelectorAll('.tab').forEach(e => e.onclick = () => { cur = +e.dataset.i; sel = null; tabs(); draw(); }); }
function push() { undoStack.push(JSON.stringify(tracks)); if (undoStack.length > 64) undoStack.shift(); }
function undo() { if (!undoStack.length) return; tracks = JSON.parse(undoStack.pop()); sel = null; draw(); }
function snapTo(t) { if (!snap) return Math.max(0, Math.round(t)); return Math.max(0, Math.round(t / snap) * snap); }
function hit(x, y) { const tr = tracks[cur]; if (!tr) return null; const n = N(y), t = T(x);
  for (let i = tr.notes.length - 1; i >= 0; i--) { const q = tr.notes[i]; if (q.note === n && t >= q.on && t <= q.on + Math.max(q.dur, 6 / zoom)) return q; } return null; }
let drag = null;
cv.addEventListener('pointerdown', e => {
  const tr = tracks[cur]; if (!tr || !tr.tape) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (x < LEFT || y < TOP) return;
  cv.setPointerCapture(e.pointerId);
  const q = hit(x, y);
  push();
  if (q) { sel = q; const edge = X(q.on + q.dur) - x < 8; drag = { q, mode: edge ? 'len' : 'move', dx: T(x) - q.on, note0: q.note, on0: q.on, len0: q.dur }; }
  else { const n = { on: snapTo(T(x)), dur: snap || 96, note: N(y), vel: 100 }; tr.notes.push(n); sel = n; drag = { q: n, mode: 'len', dx: 0, note0: n.note, on0: n.on, len0: n.dur, fresh: true }; }
  draw();
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, q = drag.q;
  if (drag.mode === 'move') { q.on = snapTo(T(x) - drag.dx); q.note = Math.max(LO, Math.min(HI, N(y))); }
  else { const end = snap ? Math.max(q.on + snap, snapTo(T(x))) : Math.max(q.on + 6, T(x)); q.dur = Math.max(1, Math.round(end - q.on)); }
  draw();
});
cv.addEventListener('pointerup', () => { drag = null; });
cv.addEventListener('wheel', e => { if (!e.shiftKey || !sel) return; e.preventDefault(); push(); sel.vel = Math.max(1, Math.min(127, sel.vel - Math.sign(e.deltaY) * 5)); status('velocity ' + sel.vel); draw(); }, { passive: false });
window.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { push(); const tr = tracks[cur]; tr.notes = tr.notes.filter(n => n !== sel); sel = null; draw(); e.preventDefault(); }
  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { undo(); e.preventDefault(); }
});
document.getElementById('snap').onchange = e => { snap = +e.target.value; };
document.getElementById('zoom').onchange = e => { zoom = +e.target.value; layout(); };
document.getElementById('undo').onclick = undo;
function status(s) { document.getElementById('status').textContent = s; }
async function load() {
  const r = await fetch('/projects/' + encodeURIComponent(NAME.replace(/\.sgq$/i, '')) + '.mid');
  if (!r.ok) { status('non riesco a leggere il progetto: ' + await r.text()); return; }
  const smf = parseSMF(await r.arrayBuffer());
  tracks = smf.tracks; bpm = Math.round(60000000 / smf.tempo);
  let last = 0; for (const t of tracks) for (const n of t.notes) last = Math.max(last, n.on + n.dur);
  bars = Math.max(1, Math.min(16, Math.ceil(last / BAR) || 4));
  cur = Math.max(0, tracks.findIndex(t => t.tape));
  tabs(); layout(); status(bpm + ' BPM · ' + bars + ' battute · ' + tracks.filter(t => t.tape).length + ' tracce TAPE');
  let lo = 60, hi = 72; for (const t of tracks) for (const n of t.notes) { lo = Math.min(lo, n.note); hi = Math.max(hi, n.note); }
  wrap.scrollTop = Math.max(0, Y(Math.min(HI, hi + 4)) - 10);
}
document.getElementById('save').onclick = async () => {
  const tapes = tracks.filter(t => t.tape);
  if (!tapes.length) { status('nessuna traccia TAPE da salvare'); return; }
  const body = writeSMF(tapes, Math.round(60000000 / bpm));
  const r = await fetch('/api/roll?file=' + encodeURIComponent(NAME), { method: 'POST', body, headers: { 'Content-Type': 'audio/midi' } });
  status(r.ok ? 'salvato: ' + await r.text() : 'errore: ' + await r.text());
};
window.addEventListener('resize', layout);
load();
</script></body></html>
